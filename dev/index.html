<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>jukebox-card dev harness</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #log { position: fixed; right: 8px; bottom: 90px; z-index: 99; width: 420px; max-height: 40vh; overflow: auto; font: 11px/1.4 ui-monospace, monospace;
      color: #9f9; background: #000c; border: 1px solid #333; padding: 6px; white-space: pre-wrap; display: none; }
    body.log #log { display: block; }
    /* ?ha=toolbar|kiosk|masonry[&sidebar=open|closed|narrow|none]: emulate the Home Assistant frontend around the card
       (fixed app toolbar of --header-height, sidebar drawer, window-scrolling view like HA 2024+). Off by default. */
    html.ha, html.ha body { height: auto; min-height: 100%; overflow: visible; }
    html.ha { --header-height: 56px; --ha-sidebar: 0px; background: #111; }
    html.ha body { font-family: Roboto, system-ui, sans-serif; }
    #ha-sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: var(--ha-sidebar); background: #1c1c1c; border-right: 1px solid #ffffff1f; z-index: 4; }
    #ha-toolbar { position: fixed; top: 0; left: var(--ha-sidebar); right: 0; height: calc(var(--header-height) + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top);
      box-sizing: border-box; display: flex; align-items: center; padding-left: 16px; color: #e1e1e1; font: 400 20px Roboto, sans-serif; background: #101010; border-bottom: 1px solid #ffffff1f; z-index: 4; }
    #ha-view { margin-left: var(--ha-sidebar); padding-top: calc(var(--header-height) + env(safe-area-inset-top)); min-height: 100vh; box-sizing: border-box; }
    html.ha.kiosk #ha-toolbar { display: none; } html.ha.kiosk #ha-view { padding-top: 0; }
    html.ha.masonry #ha-view { padding: calc(var(--header-height) + 4px) 8px 8px; } html.ha.masonry .ha-filler { height: 140px; margin: 0 0 8px; background: #1c1c1c; border-radius: 12px; }
  </style>
</head>
<body>
  <div id="log"></div>
  <script type="module">
    import { hass, onHass } from './mock-hass.js';
    await import('../dist/jukebox-card.js');
    const params = new URLSearchParams(location.search);
    if (params.get('log') === '1') document.body.classList.add('log');
    if (params.get('fresh') === '1') localStorage.removeItem('jukebox-card:recents:v1');
    // lyrics: fresh=1 also empties the lyrics cache unless keeplyrics=1; overlay=1|0 presets the per-device art overlay toggle
    if (params.get('fresh') === '1' && params.get('keeplyrics') !== '1') localStorage.removeItem('jukebox-card:lyrics:v1');
    if (params.has('overlay')) localStorage.setItem('jukebox-card:lyrics-overlay:v1', params.get('overlay') === '1' ? '1' : '0');
    // cfg=<json>: extra card options (e.g. {"lyrics_tab":false}), merged last
    const extra = params.get('cfg') ? JSON.parse(params.get('cfg')) : {};
    // spk=dyn: 0.5 dynamic speakers (targets Everywhere / Indoor / Outdoor, two presets); target=<entity> presets the remembered group
    if (params.get('fresh') === '1') localStorage.removeItem('jukebox-card:target:v1');
    if (params.get('target')) localStorage.setItem('jukebox-card:target:v1', params.get('target'));
    const L = 'media_player.living_room', K = 'media_player.kitchen', G = 'media_player.garage';
    const spk = params.get('spk') === 'dyn' ? {
      speaker_mode: 'dynamic',
      targets: [{ entity: 'media_player.everywhere', name: 'Everywhere' }, { entity: 'media_player.indoor', name: 'Indoor', members: [L, K] }, { entity: 'media_player.outdoor', name: 'Outdoor', members: [G] }],
      presets: [{ name: 'Dinner', members: [L, K], volumes: { [L]: 35, [K]: 30 }, target: 'media_player.indoor' },
        { name: 'Whole house', members: [L, K, G], volumes: { [L]: 40, [K]: 40, [G]: 60 }, target: 'media_player.indoor' }],
    } : {};
    if (params.get('recents') === '1' && !localStorage.getItem('jukebox-card:recents:v1'))
      localStorage.setItem('jukebox-card:recents:v1', JSON.stringify(['Miles Davis', 'Abbey Road', 'Jazz FM', 'Eagles', 'Fleetwood']));
    const card = document.createElement('jukebox-card');
    card.setConfig({
      type: 'custom:jukebox-card',
      entity: 'media_player.everywhere',
      config_entry_id: '01MUSICASSISTANT0000000000',
      rooms: [
        { name: 'Living Room', entity: 'media_player.living_room' },
        { name: 'Kitchen', entity: 'media_player.kitchen' },
        { name: 'Garage', entity: 'media_player.garage' },
      ],
      favorite_entity: 'button.everywhere_favorite_current_song',
      ...(params.get('noqueue') === '1' ? {} : params.get('legacyq') === '1' ? { queue_config_entry_id: '01MASSQUEUE0000000000000000' } : { mass_queue_entry_id: '01MASSQUEUE0000000000000000' }),
      screensaver_minutes: Number(params.get('saver') ?? 10),
      accent: 'mono',
      limit: 8,
      default_tab: params.get('tab') || 'now',
      ...(params.get('backdrop') ? { backdrop: params.get('backdrop') } : {}),
      font_base: '../dist/fonts',
      ...spk,
      ...extra,
    });
    card.hass = hass;
    const ha = params.get('ha');
    if (ha) {
      const root = document.documentElement; root.classList.add('ha', ha);
      const sb = params.get('sidebar') ?? 'narrow';
      root.style.setProperty('--ha-sidebar', { open: '256px', narrow: '56px', closed: '0px', none: '0px' }[sb] ?? '56px');
      if (sb === 'none' || sb === 'closed') { /* HA hides the drawer (modal) */ } else { const d = document.createElement('div'); d.id = 'ha-sidebar'; document.body.appendChild(d); }
      const tb = document.createElement('div'); tb.id = 'ha-toolbar'; tb.textContent = 'Jukebox'; document.body.appendChild(tb);
      const view = document.createElement('div'); view.id = 'ha-view'; document.body.appendChild(view);
      if (ha === 'masonry') { const f = document.createElement('div'); f.className = 'ha-filler'; view.appendChild(f); }
      view.appendChild(card);
      window.__haToolbar = (show) => { root.classList.toggle('kiosk', !show); };
      window.__haSidebar = (w) => root.style.setProperty('--ha-sidebar', w);
    } else document.body.appendChild(card);
    window.__card = card;
    window.__renders = [];
    const log = document.getElementById('log');
    card.addEventListener('jukebox-search-results', (e) => {
      window.__renders.push({ t: Math.round(performance.now()), ...e.detail });
      log.textContent += `render seq=${e.detail.seq} q="${e.detail.query}" n=${e.detail.count}${e.detail.cached ? ' (cache)' : ''}\n`;
      log.scrollTop = 1e9;
    });
    onHass((h) => { card.hass = h; const c = window.__calls.at(-1); if (c) log.textContent += `call ${c.domain}.${c.service} ${JSON.stringify(c.data)}${c.target ? ' ' + JSON.stringify(c.target) : ''}\n`; });
    window.__ready = true;
  </script>
</body>
</html>
