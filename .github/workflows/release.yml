name: Release

# Push a tag like v0.3.0 to build and publish a GitHub release.
# HACS installs the release asset(s) from the latest release (see hacs.json).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check third-party notices are up to date
        run: |
          test -s dist/THIRD_PARTY_NOTICES.md
          test -s dist/fonts/THIRD_PARTY_NOTICES.md
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Zip fonts
        # The zip holds the fonts, their OFL texts (LICENSE-*.txt) and THIRD_PARTY_NOTICES.md.
        run: cd dist && zip -r ../jukebox-card-fonts.zip fonts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jukebox-card.js
            dist/THIRD_PARTY_NOTICES.md
            jukebox-card-fonts.zip
          generate_release_notes: true
